name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [pg-storage, pg-txn, pg-catalog, pg-am-heap, pg-am-btree, pg-am-hnsw, pg-engine, pg-wire]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ${{ matrix.crate }} --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  test:
    name: Test (${{ matrix.os }} / ${{ matrix.crate }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crate: [pg-storage, pg-txn, pg-catalog, pg-am-heap, pg-am-btree, pg-am-hnsw, pg-engine, pg-wire]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Stage Q: pg-storage's `loom` feature swaps sync primitives for loom's
      # instrumented ones, which PANIC outside `loom::model` — so the two
      # loom-aware crates must be tested with default features. Running their
      # test suites with --all-features makes every non-model test panic.
      # (M3 Stage F: pg-wire declares NO features, so it rides the
      # all-features branch below unchanged. Phase 2 M4 Stage A: pg-am-hnsw
      # has no loom model and declares no features either — same
      # classification, non-loom branch.)
      - name: Test (default features — loom-gated crates)
        if: matrix.crate == 'pg-storage' || matrix.crate == 'pg-am-btree'
        run: cargo test -p ${{ matrix.crate }}
      - name: Test (all features)
        if: matrix.crate != 'pg-storage' && matrix.crate != 'pg-am-btree'
        run: cargo test -p ${{ matrix.crate }} --all-features

  loom:
    name: Loom model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The linearizable-reads model self-clamps to preemption bound 2 (see
      # the disclosure comment in btree_loom.rs); the split model runs the
      # full bound. Budget ~5 min on a runner.
      - run: cargo test -p pg-am-btree --features loom --test btree_loom
        env:
          LOOM_MAX_PREEMPTIONS: 2
      # Guard the sync-alias rule (crates/pg-storage/src/sync.rs docs): any
      # lock in the buffer-pool/WAL latch choreography must go through the
      # crate::sync aliases so loom can schedule it; direct parking_lot
      # imports anywhere else in pg-storage/src are a bug.
      - name: Guard sync-alias rule
        run: |
          if git grep "use parking_lot" -- crates/pg-storage/src | grep -v sync.rs; then
            echo "::error::direct parking_lot import outside sync.rs (see crates/pg-storage/src/sync.rs docs)"
            exit 1
          fi
      # M3 Stage A anti-enumeration guardrail (tech-selection §3.3 v1.4):
      # `Snapshot` fields are pg-txn-private and `TxnManager::snapshot()` is
      # the only REGISTERED construction point. Any `Snapshot {` literal or
      # `impl Snapshot` block outside crates/pg-txn would be an unregistered
      # construction path (new associated-fn constructors can only appear in
      # an impl block, and the orphan rule already confines those to
      # pg-txn — this grep makes the invariant fail loudly instead of
      # silently). `Snapshot::everything()` converges to the single existing
      # impl inside pg-txn and needs no allowlist entry here.
      # NOTE: use POSIX character classes only ([[:space:]] etc.) — \b and \s
      # are NOT portable (BSD git-grep ERE ignores them). The exclusion
      # pattern must account for git grep's `path:line:` output prefix (no ^
      # anchor). This guard has been verified by positive/negative injection.
      - name: Guard snapshot-construction registry rule
        run: |
          if git grep -nE "Snapshot[[:space:]]*\{" -- crates ':!crates/pg-txn' | grep -vE ':[0-9]+:[[:space:]]*(pub[[:space:]]+)?fn[[:space:]].*->[[:space:]]*Snapshot[[:space:]]*\{[[:space:]]*$'; then
            echo "::error::'Snapshot {{' literal construction outside crates/pg-txn bypasses the horizon registry (see crates/pg-txn/src/snapshot.rs docs)"
            exit 1
          fi
          if git grep -nE "impl[[:space:]]+Snapshot([[:space:]]|\{)" -- crates ':!crates/pg-txn'; then
            echo "::error::new Snapshot associated functions outside crates/pg-txn bypass the horizon registry (everything() converges to the single impl in crates/pg-txn/src/snapshot.rs)"
            exit 1
          fi
          if git grep -nE "Snapshot::new_unregistered\(" -- crates ':!crates/pg-txn'; then
            echo "::error::Snapshot::new_unregistered is pg-txn-test-only; calling it outside crates/pg-txn bypasses the horizon registry"
            exit 1
          fi

  doc:
    name: Doc (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [pg-storage, pg-txn, pg-catalog, pg-am-heap, pg-am-btree, pg-am-hnsw, pg-engine, pg-wire]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p ${{ matrix.crate }} --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Phase 2 M4 Stage A: coverage job (tech-selection §8.2 v1.3, §12) — there
  # was no pre-existing coverage toolchain in this CI, so this job is new.
  # tarpaulin requires Linux (ptrace); it cannot run on the macOS dev box,
  # so the Stage E "coverage >= 90%" verdict comes from this CI report.
  coverage:
    name: Coverage (pg-am-hnsw)
    runs-on: ubuntu-latest
    # cargo-tarpaulin builds from source on first run (rust-cache amortizes
    # it afterwards); the budget covers a cold cache with room to spare.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      # Only pg-am-hnsw is instrumented — the M4 coverage gate (§12) applies
      # to the new crate; Phase 1 crates keep their existing test jobs.
      - name: Run tarpaulin
        run: cargo tarpaulin -p pg-am-hnsw --out Xml --output-dir coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-pg-am-hnsw
          path: coverage/cobertura.xml
          if-no-files-found: error

  # Phase 2 M4 Stage D (coding plan 阶段 D "CI 数据管道手术" v1.3): the
  # siftsmall recall hard gate as a standing line of defense. The plan's
  # five-item registration checklist, item by item:
  #   (1) fetch step: scripts/fetch_datasets.sh siftsmall. URL resolution
  #       order: vars.M4_SIFTSMALL_URL -> the script's built-in default
  #       (official ftp). Once the D-1 runner verdict lands, if ftp is
  #       blocked we point the repo variable at the self-hosted release
  #       asset (scheme 2) — zero changes to this job or the script.
  #   (2) actions/cache@v4: path = datasets/, key =
  #       m4-dataset-siftsmall-5304531 (dataset name + byte size). The
  #       fetched payload is not content-addressable from the workflow side,
  #       so the key uses byte size + a version prefix — bump the key when
  #       the dataset changes.
  #   (3) ownership: a NEW recall-gate job, deliberately NOT added to the
  #       existing test matrix — matrix jobs have no dataset, and the gate
  #       test skipping there is the designed, harmless behavior.
  #   (4) M4_REQUIRE_DATASET=1 is set at STEP level env on the gate step
  #       only; it never leaks into other steps or jobs.
  #   (5) guardrail cross-check (2026-09-03, manual review conclusion
  #       recorded here): the existing grep guardrails (loom job) scope
  #       `git grep` to crates/... — no overlap with datasets/ or .github/,
  #       so the new steps below cannot affect them; no new grep step is
  #       needed.
  recall-gate:
    name: Recall gate (siftsmall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache siftsmall dataset
        uses: actions/cache@v4
        with:
          path: datasets/
          key: m4-dataset-siftsmall-5304531
      - name: Fetch siftsmall
        env:
          M4_DATASET_URL_SIFTSMALL: ${{ vars.M4_SIFTSMALL_URL }}
        run: scripts/fetch_datasets.sh siftsmall
      # --release is the contract's pinned tier. (Debug was measured after
      # Stage D round 1: 62.4 s for the gate suite — recorded in
      # docs/phase2-m4-benchmarks.md §3; release keeps the runner fast.)
      - name: Recall hard gate
        run: cargo test -p pg-am-hnsw --release --test recall_siftsmall
        env:
          M4_REQUIRE_DATASET: "1"
