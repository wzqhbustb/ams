name: Bench Nightly

on:
  schedule:
    # 每天 03:17 UTC 一次（避开整点，GitHub 整点/半点 cron 拥塞易延迟）
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 防止手动触发与定时触发堆叠：同一时间只跑一个 nightly，新触发取消旧的。
concurrency:
  group: bench-nightly
  cancel-in-progress: true

jobs:
  bench-smoke:
    name: Criterion smoke (--quick)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # criterion 0.5.1 原生支持 `--quick`（lib.rs 注册 clap arg：
      # "Benchmark only until the significance level has been reached"），
      # 自动把 warm-up/measurement 时间和 sample size 压到最小档，
      # 无需手动拼 --measurement-time/--warm-up-time/--sample-size。
      # 取舍：nightly 只验证全部 bench 可运行不崩溃（smoke），数字仅供
      # 浏览，不做 baseline 硬门槛比对——baseline 持久化与回归比对归
      # Phase 4b 专项。全部 18 个 bench target（crates/*/benches/；2026-09-08
      # Phase 2 M4 Stage E 起含 pg-am-hnsw 的 hnsw_build_search）在
      # quick 模式下预计远低于 15 分钟，timeout-minutes: 30 留足余量。
      - name: Run criterion smoke subset
        run: cargo bench --workspace -- --quick
      - name: List criterion artifacts
        run: ls target/criterion
