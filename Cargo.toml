[workspace]
members = [
    "crates/pg-storage",
    "crates/pg-txn",
    "crates/pg-catalog",
    "crates/pg-am-heap",
    "crates/pg-am-btree",
    "crates/pg-am-hnsw",
    "crates/pg-engine",
    "crates/pg-wire",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
authors = ["pg_rust contributors"]
license = "Apache-2.0"
