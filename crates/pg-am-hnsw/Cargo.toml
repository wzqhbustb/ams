[package]
name = "pg-am-hnsw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "pg_rust in-memory HNSW vector index — Phase 2 M4 (Stage A: encoding, distance, PRNG)"

[dependencies]
# error types
thiserror = "2"

# CRC32 prefix for the snapshot byte stream (tech-selection §7, §10: same
# crate pg-storage's WAL/checkpoint path uses — "formats hand-written,
# mature primitives reused")
crc32fast = "1.3"

# M4 direct dependencies are frozen at {thiserror, crc32fast} (tech-selection
# §2 v1.5): the pg-storage edge is deferred to M5, when WAL/buffer-pool
# integration creates a real consumer. Do not add dependencies before then.

[dev-dependencies]
# benchmarks (Stage E, coding plan "criterion bench" row). The §2 freeze
# above covers RUNTIME dependencies; criterion is dev-only. Version 0.5
# matches pg-storage's dev-dependency and the lockfile's pinned 0.5.1, whose
# dependency chain is already proven MSRV-1.86-clean by the workspace MSRV
# job (2026-09-08).
criterion = "0.5"

[[bench]]
name = "hnsw_build_search"
harness = false
